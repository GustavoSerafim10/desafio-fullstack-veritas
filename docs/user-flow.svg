<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect width="1180" height="640" fill="#f4f5f7"/>
  <text x="40" y="44" font-size="22" font-weight="bold" fill="#1f2430">User Flow — Mini Kanban de Tarefas</text>
  <text x="40" y="66" font-size="13" fill="#6b7280">Fluxo de uso do sistema: do carregamento do quadro até a conclusão de uma tarefa</text>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="100" width="200" height="70" rx="10" fill="#ffffff" stroke="#e2e4e9"/>
    <text x="140" y="130" font-size="14" text-anchor="middle" fill="#1f2430">Usuário abre</text>
    <text x="140" y="148" font-size="14" text-anchor="middle" fill="#1f2430">o Mini Kanban</text>
  </g>

  <line x1="240" y1="135" x2="300" y2="135" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="300" y="100" width="220" height="70" rx="10" fill="#ffffff" stroke="#e2e4e9"/>
    <text x="410" y="130" font-size="14" text-anchor="middle" fill="#1f2430">Frontend consome</text>
    <text x="410" y="148" font-size="14" text-anchor="middle" fill="#1f2430">GET /tasks (API Go)</text>
  </g>

  <line x1="520" y1="135" x2="580" y2="135" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="580" y="100" width="240" height="70" rx="10" fill="#ffffff" stroke="#e2e4e9"/>
    <text x="700" y="130" font-size="14" text-anchor="middle" fill="#1f2430">Quadro renderizado</text>
    <text x="700" y="148" font-size="14" text-anchor="middle" fill="#1f2430">com 3 colunas fixas</text>
  </g>

  <line x1="700" y1="170" x2="700" y2="220" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision -->
  <polygon points="700,220 800,270 700,320 600,270" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="700" y="266" font-size="13" text-anchor="middle" fill="#1f2430">Ação do</text>
  <text x="700" y="282" font-size="13" text-anchor="middle" fill="#1f2430">usuário?</text>

  <!-- Branch: Create -->
  <line x1="600" y1="270" x2="410" y2="270" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="260" font-size="11" fill="#6b7280" text-anchor="middle">+ Nova tarefa</text>
  <g>
    <rect x="230" y="235" width="180" height="70" rx="10" fill="#ffffff" stroke="#e2e4e9"/>
    <text x="320" y="265" font-size="13" text-anchor="middle" fill="#1f2430">Preenche título</text>
    <text x="320" y="283" font-size="13" text-anchor="middle" fill="#1f2430">e descrição no modal</text>
  </g>
  <line x1="230" y1="270" x2="150" y2="270" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="30" y="235" width="120" height="70" rx="10" fill="#ffffff" stroke="#e2e4e9"/>
    <text x="90" y="265" font-size="13" text-anchor="middle" fill="#1f2430">POST /tasks</text>
    <text x="90" y="283" font-size="13" text-anchor="middle" fill="#1f2430">status: todo</text>
  </g>

  <!-- Branch: Move -->
  <line x1="800" y1="270" x2="960" y2="270" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="890" y="260" font-size="11" fill="#6b7280" text-anchor="middle">Arrasta card</text>
  <g>
    <rect x="960" y="235" width="180" height="70" rx="10" fill="#ffffff" stroke="#e2e4e9"/>
    <text x="1050" y="260" font-size="13" text-anchor="middle" fill="#1f2430">Solta em outra</text>
    <text x="1050" y="278" font-size="13" text-anchor="middle" fill="#1f2430">coluna (drag &amp; drop)</text>
  </g>
  <line x1="1050" y1="305" x2="1050" y2="350" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="960" y="350" width="180" height="60" rx="10" fill="#ffffff" stroke="#e2e4e9"/>
    <text x="1050" y="376" font-size="13" text-anchor="middle" fill="#1f2430">PUT /tasks/:id</text>
    <text x="1050" y="394" font-size="13" text-anchor="middle" fill="#1f2430">novo status</text>
  </g>

  <!-- Branch: Edit/Delete -->
  <line x1="700" y1="320" x2="700" y2="370" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="350" font-size="11" fill="#6b7280">Editar / Excluir</text>
  <g>
    <rect x="600" y="370" width="200" height="70" rx="10" fill="#ffffff" stroke="#e2e4e9"/>
    <text x="700" y="400" font-size="13" text-anchor="middle" fill="#1f2430">Clica em ✏️ ou 🗑️</text>
    <text x="700" y="418" font-size="13" text-anchor="middle" fill="#1f2430">no card da tarefa</text>
  </g>
  <line x1="700" y1="440" x2="700" y2="480" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="580" y="480" width="240" height="60" rx="10" fill="#ffffff" stroke="#e2e4e9"/>
    <text x="700" y="507" font-size="13" text-anchor="middle" fill="#1f2430">PUT /tasks/:id ou</text>
    <text x="700" y="525" font-size="13" text-anchor="middle" fill="#1f2430">DELETE /tasks/:id</text>
  </g>

  <!-- Convergence -->
  <line x1="90" y1="305" x2="90" y2="580" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="90" y1="580" x2="1050" y2="580" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="1050" y1="410" x2="1050" y2="580" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="700" y1="540" x2="700" y2="580" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="570" y1="580" x2="570" y2="600" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="400" y="600" width="340" height="34" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="570" y="622" font-size="13" text-anchor="middle" fill="#1f2430">Estado atualizado e refletido na UI em tempo real</text>
  </g>
</svg>
